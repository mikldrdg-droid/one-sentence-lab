'use strict';

const WORDS={en:[['water','물'],['book','책'],['cat','고양이'],['dog','개','강아지'],['music','음악'],['tea','차'],['bread','빵'],['rice','밥','쌀'],['apple','사과'],['milk','우유'],['school','학교'],['friend','친구']],ja:[['みず','물'],['ほん','책'],['ねこ','고양이'],['いぬ','개','강아지'],['おんがく','음악'],['おちゃ','차'],['パン','빵'],['ごはん','밥'],['りんご','사과'],['ぎゅうにゅう','우유'],['がっこう','학교'],['ともだち','친구']]};
const SENTENCES={en:[{t:['I','like','music'],ko:'나는 음악을 좋아해요',g:['나는','좋아해요','음악을'],rule:'영어에서는 보통 ‘누가 → 행동 → 대상’ 순서로 말해요.',change:['music','tea','차'],final:'나는 차를 좋아해요'},{t:['I','like','tea'],ko:'나는 차를 좋아해요',g:['나는','좋아해요','차를'],rule:'I like + 좋아하는 대상. 대상을 바꾸면 새로운 문장이 됩니다.',change:['tea','music','음악'],final:'나는 음악을 좋아해요'},{t:['I','read','a','book'],ko:'나는 책을 읽어요',g:['나는','읽어요','하나의','책을'],rule:'read 뒤에 읽는 대상을 놓아요. a book은 책 한 권을 나타냅니다.',change:['book','book','책'],final:'나는 책을 읽어요'},{t:['I','drink','water'],ko:'나는 물을 마셔요',g:['나는','마셔요','물을'],rule:'I drink + 마시는 것. water 앞에는 여기서 a를 붙이지 않아요.',change:['water','milk','우유'],final:'나는 우유를 마셔요'},{t:['I','eat','bread'],ko:'나는 빵을 먹어요',g:['나는','먹어요','빵을'],rule:'I eat + 먹는 것. eat 뒤에 음식을 놓아요.',change:['bread','rice','밥'],final:'나는 밥을 먹어요'},{t:['You','like','music'],ko:'당신은 음악을 좋아해요',g:['당신은','좋아해요','음악을'],rule:'I 대신 You를 놓아 말하는 대상을 바꿀 수 있어요.',change:['music','tea','차'],final:'당신은 차를 좋아해요'}],ja:[{t:['わたし','は','おんがく','が','すきです'],ko:'나는 음악을 좋아해요',g:['나','주제 표시','음악','대상 표시','좋아해요'],rule:'‘わたしは ○○が すきです’는 내가 무엇을 좋아하는지 말하는 틀입니다. は는 조사일 때 ‘와’로 읽어요.',change:['おんがく','おちゃ','차'],final:'나는 차를 좋아해요'},{t:['わたし','は','おちゃ','が','すきです'],ko:'나는 차를 좋아해요',g:['나','주제 표시','차','대상 표시','좋아해요'],rule:'すきです는 좋아한다는 뜻입니다. 대상 뒤의 が까지 묶어 익혀보세요.',change:['おちゃ','おんがく','음악'],final:'나는 음악을 좋아해요'},{t:['わたし','は','ほん','を','よみます'],ko:'나는 책을 읽어요',g:['나','주제 표시','책','목적어 표시','읽어요'],rule:'일본어에서는 보통 동작이 문장 끝에 옵니다. を는 목적어를 나타내며 ‘오’로 읽어요.',change:['ほん','ほん','책'],final:'나는 책을 읽어요'},{t:['わたし','は','みず','を','のみます'],ko:'나는 물을 마셔요',g:['나','주제 표시','물','목적어 표시','마셔요'],rule:'‘○○を のみます’는 무엇을 마신다는 표현입니다. 한국어와 비슷하게 동작이 뒤에 와요.',change:['みず','ぎゅうにゅう','우유'],final:'나는 우유를 마셔요'},{t:['わたし','は','パン','を','たべます'],ko:'나는 빵을 먹어요',g:['나','주제 표시','빵','목적어 표시','먹어요'],rule:'‘○○を たべます’는 무엇을 먹는다는 뜻입니다.',change:['パン','ごはん','밥'],final:'나는 밥을 먹어요'},{t:['これ','は','ほん','です'],ko:'이것은 책이에요',g:['이것','주제 표시','책','이에요'],rule:'‘これは ○○です’는 이것이 무엇인지 말하는 틀입니다.',change:['ほん','パン','빵'],final:'이것은 빵이에요'}]};
const MODES={focus:{name:'주의력',title:'작은 차이 찾기',desc:'문장이나 단어를 정확하게 살펴봐요.',icon:'⌕'},memory:{name:'작업기억',title:'한 문장 붙잡기',desc:'짧은 문장을 기억하고 내용을 바꿔봐요.',icon:'▤'},recall:{name:'장기기억·인출',title:'가리고 떠올리기',desc:'단어 뜻을 직접 꺼내고 간격을 두고 복습해요.',icon:'↺'},pattern:{name:'규칙·패턴',title:'문장 조립하기',desc:'배운 문장 틀에 맞춰 단어를 배열해요.',icon:'≋'},monitor:{name:'메타인지',title:'아는 만큼 확신하기',desc:'내 예상과 실제 정답을 비교해봐요.',icon:'◎'}};
let db={lang:'en',sessions:[],cards:{}},storageOK=true;try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.sessions)&&d.cards&&['en','ja'].includes(d.lang))db=d}catch(e){storageOK=false}let game=null,page='home',timers=[],pending='home';const rand=n=>Math.floor(Math.random()*n);function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=rand(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}const nameLang=l=>l==='en'?'영어':'일본어',modeName=m=>m==='mix'?'오늘의 독학 한 바퀴':MODES[m].name,wordKey=(l,i)=>l+':'+i,normalize=x=>String(x).normalize('NFKC').toLowerCase().replace(/[\s.,!?。！？·]/g,'');function stop(){timers.forEach(clearTimeout);timers=[]}function later(fn,ms){timers.push(setTimeout(fn,ms))}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){storageOK=false}}function today(){return new Date().toLocaleDateString('sv-SE')}function dueCount(l){return WORDS[l].filter((_,i)=>db.cards[wordKey(l,i)]?.due<=Date.now()).length}function getWords(l,n){const indices=WORDS[l].map((_,i)=>i);return indices.sort((a,b)=>{const x=db.cards[wordKey(l,a)],y=db.cards[wordKey(l,b)];const tier=c=>!c?1:c.due<=Date.now()?0:2;return tier(x)-tier(y)||(x?.due||0)-(y?.due||0)||a-b}).slice(0,n)}
function go(p){if(game){pending=p;pause();$('#leave').showModal();return}open(p)}function open(p){stop();game=null;page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='home')home();else if(p==='records')records();else guide();window.scrollTo({top:0,behavior:'instant'})}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#stay').onclick=()=>{$('#leave').close();resume()};$('#leaveyes').onclick=()=>{$('#leave').close();open(pending)};$('#leave').addEventListener('cancel',()=>later(resume,0));
function home(){const l=db.lang,done=db.sessions.filter(s=>s.lang===l&&s.day===today()).length;app.innerHTML=`<div class="langbar"><span class="kicker">ONE SENTENCE · SELF-STUDY LAB</span><div class="toggle" aria-label="학습 언어"><button class="${l==='en'?'selected':''}" onclick="setLang('en')" aria-pressed="${l==='en'}">영어</button><button class="${l==='ja'?'selected':''}" onclick="setLang('ja')" aria-pressed="${l==='ja'}">일본어</button></div></div><section class="hero"><div><h1>혼자 배우는 힘,<br>한 문장씩.</h1><p class="muted">먼저 이해하고, 가리고 떠올리고,<br>틀린 부분을 고치는 작은 독학 연습실.</p><span class="tag">${nameLang(l)} 기초 · 오늘 ${done}세트 · 복습할 단어 ${dueCount(l)}개</span></div><div class="desk" aria-hidden="true"><div class="sheet"><small>MY SMALL NOTEBOOK</small><strong>${l==='en'?'I like music.':'おんがくが<br>すきです。'}</strong><i></i><span class="small muted">기억에서 꺼내는 작은 한 문장</span><i></i></div><div class="sticker">あ A</div></div></section><section class="feature"><div><span class="kicker" style="color:#eac8a7">A SMALL STUDY SESSION</span><h2>오늘의 독학 한 바퀴</h2><p>단어 2개 배우기 → 주의·기억·문장 연습 → 자기 점검 → 단어 뜻을 가리고 떠올리기.</p><span class="small">총 10문항 · 시간제한 없음 · 처음에는 1단계부터</span></div><button class="btn" onclick="setup('mix')">오늘의 연습 시작 ↗</button></section><div class="sectionhead"><h2>하나씩 연습하기</h2><span class="small muted">기초 12단어 · 6문장 틀</span></div><div class="grid">${Object.entries(MODES).map(([k,m],i)=>`<article class="card"><span class="kicker">0${i+1} / ${m.name}</span><div class="symbol">${m.icon}</div><h3>${m.title}</h3><p>${m.desc}</p><button class="btn alt" onclick="setup('${k}')">연습하기 →</button></article>`).join('')}<article class="card"><span class="kicker">MY NOTEBOOK</span><div class="symbol">✎</div><h3>기초 단어장</h3><p>처음 보는 단어를 뜻과 연결하고, 복습 예정일도 확인하세요.</p><button class="btn line" onclick="vocabulary()">단어장 보기 →</button></article></div><p class="note">독학에 필요한 ‘두뇌 합격 점수’는 없습니다. 이곳은 실제 외국어를 이용한 기초 연습이며, 인지기능 향상이나 독학 능력을 진단하는 검사가 아닙니다.</p><div class="footerlinks"><a href="./one-sentence.html" download=" function setLang(l){db.lang=l;save();home()}function setup(mode){page='setup';app.innerHTML=`<div class="play"><button class="btn line" onclick="go('home')">← 연습실</button><section class="panel"><span class="kicker">${nameLang(db.lang)} · GET READY</span><h1 style="font-size:34px">${modeName(mode)}</h1><p>${mode==='mix'?'한 번에 많이 외우기보다 단어 두 개와 짧은 문장부터 익혀요.':MODES[mode].desc}</p><div class="rulebox">${mode==='recall'?'외국어 단어를 보고 한국어 뜻을 직접 입력합니다. 떠오르지 않으면 ‘기억 안 나요’를 누르세요.':'문제마다 방법을 안내하고, 정답과 이유를 바로 확인합니다.'}</div><div class="settings"><div><label for="level">난이도</label><select id="level"><option value="1">1단계 · 짧게 익히기</option><option value="2">2단계 · 문장으로 연결</option><option value="3">3단계 · 정보 바꿔 기억하기</option></select></div><div><label for="kind">기록 방식</label><select id="kind"><option value="train">연습 · 기록 저장</option><option value="practice">방법 익히기 · 기록 제외</option></select></div></div><p class="small muted">${mode==='mix'?'10문항':mode==='recall'?'단어 3개':'6문항'} · 시간제한 없이 진행합니다. 난이도는 직접 선택하며 자동으로 올리지 않습니다.</p><details><summary>이번 연습의 방법</summary><p class="small">${help(mode)}</p></details><button class="btn" id="start">준비됐어요 →</button></section></div>`;$('#start').onclick=()=>start(mode,+$('#level').value,$('#kind').value)}
function help(m){const h={focus:'목표 글자를 보면서 같은 표현을 찾습니다. 익숙한 단어라도 철자와 순서를 끝까지 확인하세요.',memory:'뜻과 문장 조각을 먼저 확인합니다. 가린 뒤 뜻을 떠올리고, 3단계에서는 새 정보로 내용을 바꿉니다.',recall:'배운 단어를 보고 한국어 뜻을 직접 입력하세요. 답을 확인한 뒤에는 스스로 맞았다고 바꿀 수 없습니다. 복습 예정 단어부터 고릅니다. 새 단어는 뜻을 먼저 배우고, 이전 회상 기록이 있는 단어는 뜻을 미리 보여주지 않습니다.',pattern:'짧은 설명을 읽은 뒤 단어 조각을 순서대로 눌러 문장을 만듭니다. 문장 속 조각을 누르면 취소할 수 있습니다.',monitor:'문장의 뜻을 고르기 전에 얼마나 확실한지 표시합니다. 확신과 정답 여부를 비교해 다음에 확인할 부분을 찾습니다.',mix:'단어 2개를 배운 뒤 주의력·작업기억·문장 구성·자기 점검을 번갈아 합니다. 마지막에는 처음 배운 두 단어의 뜻을 가리고 직접 떠올립니다.'};return h[m]}
function start(mode,level,kind){stop();const lang=db.lang,wordIds=getWords(lang,mode==='recall'?3:2),sids=shuffle(SENTENCES[lang].map((_,i)=>i));const plan=mode==='mix'?['focus','memory','pattern','monitor','focus','memory','pattern','monitor','recall','recall']:Array(mode==='recall'?3:6).fill(mode);game={mode,level,kind,lang,wordIds,sids,plan,pos:0,rows:[],paused:false,locked:true,assisted:false,pauses:0,confidence:null,selected:[]};page='play';shell();if(mode==='mix'||mode==='recall')teachWords();else prepare()}
function shell(){app.innerHTML=`<section class="play"><div class="row"><b>${nameLang(game.lang)} · ${modeName(game.mode)}</b><button class="btn line" id="pause">잠깐 쉬기</button></div><div class="progress"><div id="bar"></div></div><div class="row small muted"><span id="count"></span><span id="leveltext"></span></div><section class="panel"><div class="small muted" id="domain"></div><div class="arena" id="arena"></div><div class="options" id="options"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div id="nextbox" class="actions" style="justify-content:center"></div></section><p class="note">속도 경쟁 없이 진행해요. 뜻을 먼저 확인하고, 틀리면 설명을 읽은 뒤 다음 문제로 넘어가세요.</p></section>`;$('#pause').onclick=pause}
function clear(){stop();game.locked=true;$('#options').innerHTML='';$('#options').className='options';$('#feedback').textContent='';$('#nextbox').innerHTML='';$('#arena').innerHTML=''}function status(){const g=game;$('#count').textContent=`${Math.min(g.pos+1,g.plan.length)} / ${g.plan.length} 문항`;$('#leveltext').textContent=`${g.level}단계 · ${g.kind==='practice'?'체험':'연습'}`;$('#bar').style.width=(g.pos/g.plan.length*100)+'%'}
function teachWords(){const newIds=game.wordIds.filter(i=>!db.cards[wordKey(game.lang,i)]);if(!newIds.length){prepare();return}game.phase='words';clear();status();$('#domain').textContent='준비 · 오늘의 단어';$('#arena').innerHTML=`<h2>먼저 뜻을 연결해요.</h2><div class="vocab">${newIds.map(i=>`<div><b lang="${game.lang}">${WORDS[game.lang][i][0]}</b><span>${WORDS[game.lang][i][1]}</span></div>`).join('')}</div><p class="small muted">처음 배우는 단어만 뜻을 먼저 보여줍니다.<br>복습 단어는 뜻을 미리 보여주지 않고 떠올립니다.</p>`;$('#options').innerHTML='<button id="learned" class="full">뜻을 확인했어요 →</button>';$('#learned').onclick=prepare}
function sentenceAt(g){return SENTENCES[g.lang][g.sids[g.pos%g.sids.length]]}function gloss(s){return '<div class="gloss">'+s.t.map((x,i)=>`<span lang="${game.lang}">${x}<small>${s.g[i]}</small></span>`).join('')+'</div>'}function sentenceText(s){return s.t.join(' ')}function choices(correct,others,n=4){return shuffle([correct,...shuffle([...new Set(others.filter(x=>x!==correct))]).slice(0,n-1)])}
function makeQuestion(g){const mode=g.plan[g.pos],s=sentenceAt(g),lang=g.lang,all=SENTENCES[lang];if(mode==='focus'){const index=g.wordIds[g.pos%g.wordIds.length],target=g.level===1?WORDS[lang][index][0]:sentenceText(s),options=g.level===1?choices(target,WORDS[lang].map(x=>x[0])):choices(target,all.map(sentenceText));return {mode,s,prompt:'목표와 완전히 같은 표현을 고르세요',reference:target,translation:g.level===1?WORDS[lang][index][1]:s.ko,options,correct:options.indexOf(target),explain:'글자와 순서를 끝까지 확인해요. 목표: '+target}}
if(mode==='memory'){const changed=g.level===3&&s.change[0]!==s.change[1],correct=changed?s.final:s.ko,options=choices(correct,[...all.map(x=>x.ko),...all.map(x=>x.final)]);return {mode,s,changed,prompt:changed?'바꾼 문장의 뜻은 무엇인가요?':'기억한 문장의 뜻은 무엇인가요?',options,correct:options.indexOf(correct),explain:correct+(changed?' · '+s.change[0]+' → '+s.change[1]+' 변경을 반영했어요.':'')}}
if(mode==='pattern'){const items=shuffle(s.t.map((text,id)=>({text,id})));if(g.level===3){const extra=lang==='en'?'You':'これ';if(!s.t.includes(extra))items.push({text:extra,id:s.t.length})}return {mode,s,items,prompt:'이 뜻이 되도록 문장을 조립하세요',explain:s.rule}}
if(mode==='monitor'){const options=choices(s.ko,all.map(x=>x.ko));return {mode,s,prompt:'이 문장의 뜻을 고르세요',options,correct:options.indexOf(s.ko),explain:s.ko+' · '+s.rule}}
const recallIndex=g.plan.slice(0,g.pos).filter(x=>x==='recall').length;const wi=g.wordIds[recallIndex%g.wordIds.length];return {mode,wi,word:WORDS[lang][wi],prompt:'한국어 뜻을 직접 떠올려 적으세요',explain:WORDS[lang][wi][0]+' = '+WORDS[lang][wi][1]}}
function prepare(){if(!game||game.paused)return;if(game.pos===game.plan.length){finish();return}clear();status();game.confidence=null;game.selected=[];game.q=makeQuestion(game);$('#domain').textContent=MODES[game.q.mode].name;if(['memory','pattern','monitor'].includes(game.q.mode))teachSentence();else showQuestion()}
function teachSentence(){game.phase='sentence';const q=game.q,s=q.s;$('#arena').innerHTML=`<span class="kicker">먼저 이해하기</span><div class="foreign" lang="${game.lang}">${sentenceText(s)}</div><div class="translation">${s.ko}</div>${gloss(s)}<div class="rulebox">${s.rule}</div><p class="small muted">일본어의 띄어쓰기는 학습용 구분입니다. 뜻을 확인한 뒤 다음으로 넘어가세요.</p>`;if(game.lang==='en')$('#arena').lastElementChild.textContent='의미 조각을 묶어 이해하고 다음으로 넘어가세요.';$('#options').innerHTML='<button id="understood" class="full">뜻을 이해했어요 · 가리기 →</button>';$('#understood').onclick=()=>{if(q.mode==='memory'&&q.changed){clear();$('#arena').innerHTML=`<div class="prompt">${q.s.change[0]} 대신<br><b>${q.s.change[1]}</b>로 바꿔보세요.</div><div class="translation">새 단어의 뜻: ${q.s.change[2]}</div><p class="small muted">나머지 내용은 그대로 유지하세요.</p>`;$('#options').innerHTML='<button class="full" id="updated">바꿔 기억했어요 →</button>';$('#updated').onclick=showQuestion}else showQuestion()}}
function confidenceUI(){return `<p class="small muted">답하기 전에, 얼마나 확실한가요?</p><div class="confidence">${[['sure','확실해요'],['unsure','조금 헷갈려요'],['unknown','잘 모르겠어요']].map(([v,t])=>`<button data-confidence="${v}" aria-pressed="false">${t}</button>`).join('')}</div>`}function bindConfidence(){document.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>{if(game.locked)return;game.confidence=b.dataset.confidence;document.querySelectorAll('[data-confidence]').forEach(x=>{x.classList.toggle('chosen',x===b);x.setAttribute('aria-pressed',String(x===b))});$('#feedback').textContent='예상을 선택했어요. 이제 답해보세요.'})}
function showQuestion(){if(!game||game.paused)return;game.phase='question';const q=game.q;clear();$('#arena').innerHTML=`<div class="prompt">${q.prompt}</div>`;if(q.mode==='focus')$('#arena').innerHTML+=`<div class="rulebox"><small>목표 · ${q.translation}</small><br><b class="foreign" style="font-size:26px" lang="${game.lang}">${q.reference}</b></div>`;if(q.mode==='monitor')$('#arena').innerHTML+=`<div class="foreign" lang="${game.lang}">${sentenceText(q.s)}</div>${confidenceUI()}`;if(q.mode==='recall'){$('#arena').innerHTML+=`<div class="foreign" lang="${game.lang}">${q.word[0]}</div><form id="recallform" class="recallform"><label for="typed">한국어 뜻</label><input id="typed" autocomplete="off" maxlength="40" placeholder="예: 물"><button class="btn" style="margin-top:14px" type="submit">답 확인하기</button></form>`;$('#options').innerHTML='<button id="forgot" class="full">기억 안 나요 · 정답 보기</button>';$('#recallform').onsubmit=e=>{e.preventDefault();const answer=$('#typed').value;if(!answer.trim()){$('#feedback').textContent='뜻을 적거나 ‘기억 안 나요’를 눌러주세요.';return}grade(q.word.slice(1).some(x=>normalize(x)===normalize(answer)),answer)};$('#forgot').onclick=()=>grade(false,'기억 안 나요')}
else if(q.mode==='pattern'){$('#arena').innerHTML+=`<div class="translation">${q.s.ko}</div><div id="assembled" class="answerline" aria-label="조립한 문장"></div><div id="tokens" class="tokens"></div><p class="small muted">단어를 차례로 눌러요. 위 문장의 조각을 누르면 취소돼요.</p>`;$('#options').innerHTML='<button id="checkpattern" class="full">완성한 문장 확인</button>';renderTokens();$('#checkpattern').onclick=()=>{if(!game.selected.length){$('#feedback').textContent='단어 조각을 눌러 문장을 만들어주세요.';return}const built=game.selected.map(i=>q.items[i].text);grade(built.join('|')===q.s.t.join('|'),built.join(' '))}}
else{$('#options').innerHTML=q.options.map((v,i)=>`<button data-answer="${i}" lang="${q.mode==='monitor'||q.mode==='memory'?'ko':game.lang}">${v}</button>`).join('');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(q.mode==='monitor'&&!game.confidence){$('#feedback').textContent='먼저 얼마나 확실한지 선택해주세요.';return}grade(+b.dataset.answer===q.correct,q.options[+b.dataset.answer])})}game.locked=false;game.at=performance.now();if(q.mode==='monitor')bindConfidence()}
function renderTokens(){const q=game.q;$('#assembled').innerHTML=game.selected.length?game.selected.map((idx,i)=>`<button data-remove="${i}">${q.items[idx].text}</button>`).join(''):'<span class="small muted">여기에 문장을 만들어보세요</span>';$('#tokens').innerHTML=q.items.map((it,i)=>`<button data-token="${i}" ${game.selected.includes(i)?'disabled':''}>${it.text}</button>`).join('');document.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{if(game.locked)return;game.selected.push(+b.dataset.token);renderTokens()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(game.locked)return;game.selected.splice(+b.dataset.remove,1);renderTokens()})}
function grade(ok,answer){if(!game||game.locked||game.paused)return;game.locked=true;const q=game.q;const row={mode:q.mode,ok,answer,confidence:game.confidence,ms:Math.round(performance.now()-game.at),assisted:game.assisted,wi:q.wi??null};game.rows.push(row);document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(+b.dataset.answer===q.correct)b.classList.add('correct');else if(q.options[+b.dataset.answer]===answer)b.classList.add('wrong')});document.querySelectorAll('[data-token],[data-remove],[data-confidence],#forgot,#checkpattern,#typed,#recallform button').forEach(b=>b.disabled=true);let correct=q.mode==='pattern'?sentenceText(q.s):q.explain;$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=(ok?'맞았어요. ':'정답을 확인해요. ')+correct;if(q.mode==='pattern')$('#feedback').textContent+=' · '+q.s.rule;if(q.mode==='monitor'){const msg=game.confidence==='sure'&&!ok?'확실하게 느껴져도 헷갈릴 수 있어요. 틀린 부분을 다시 살펴보세요.':game.confidence==='unknown'&&ok?'자신 없었지만 맞혔어요. 다음에도 설명할 수 있는지 확인해요.':ok?'내 예상과 정답을 함께 확인했어요.':'헷갈리는 부분을 발견했어요. 설명을 다시 읽어보세요.';$('#feedback').textContent+=' '+msg}$('#nextbox').innerHTML='<button class="btn" id="next">'+(game.pos+1===game.plan.length?'결과 보기 →':'다음으로 →')+'</button>';$('#next').onclick=()=>{game.pos++;game.assisted=false;prepare()}}
function pause(){if(!game||game.paused)return;stop();game.paused=true;game.locked=true;$('#pause').disabled=true;$('#domain').textContent='휴식';$('#arena').innerHTML='<h2>잠깐 쉬어가요.</h2><p class="muted">준비되면 다시 시작해요.</p>';$('#options').innerHTML='<button id="resume">이어서 하기</button><button id="quit">종료하기</button>';$('#feedback').textContent='진행 중인 문항은 다시 읽습니다. 다시 읽은 문항은 도움받음으로 표시해 비교에서 제외해요.';$('#nextbox').innerHTML='';$('#resume').onclick=resume;$('#quit').onclick=()=>go('home')}
function resume(){if(!game||!game.paused)return;game.paused=false;game.pauses++;$('#pause').disabled=false;if(game.phase==='words'){game.assisted=false;teachWords();return}if(game.rows.length>game.pos){game.pos++;game.assisted=false;prepare()}else{game.assisted=true;prepare()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game)pause()});
function stats(rows){const r=rows.filter(x=>!x.assisted),ok=r.filter(x=>x.ok);return {n:r.length,correct:ok.length,acc:r.length?Math.round(ok.length/r.length*100):null,assisted:rows.length-r.length}}function updateCard(l,wi,ok,now=Date.now()){const key=wordKey(l,wi),old=db.cards[key]||{streak:0,reviews:0},streak=ok?old.streak+1:0,days=[1,2,4,7,14,30];db.cards[key]={streak,reviews:old.reviews+1,last:now,due:now+(ok?days[Math.min(streak-1,days.length-1)]*86400000:600000),lastOK:ok}}
function domainStats(rows){return Object.entries(MODES).map(([k,m])=>{const list=rows.filter(x=>x.mode===k);if(!list.length)return '';const s=stats(list);return `<div class="domainrow"><b>${m.name}</b><span>${s.n?s.acc+'% ('+s.correct+'/'+s.n+')':'비교 문항 없음'}${s.assisted?' · 도움 '+s.assisted+'개':''}<div class="bar"><div style="width:${s.acc||0}%"></div></div></span></div>`}).join('')}
function finish(){const g=game,s=stats(g.rows),session={day:today(),at:new Date().toISOString(),lang:g.lang,mode:g.mode,level:g.level,kind:g.kind,rows:g.rows,stats:s,pauses:g.pauses};if(g.kind!=='practice'){for(const r of g.rows)if(r.mode==='recall'&&!r.assisted)updateCard(g.lang,r.wi,r.ok);db.sessions.push(session);save()}game=null;page='result';const monitor=g.rows.filter(x=>x.mode==='monitor'&&!x.assisted),confWrong=monitor.filter(x=>x.confidence==='sure'&&!x.ok).length;app.innerHTML=`<div class="play"><span class="kicker">ONE SMALL SENTENCE, WELL LEARNED</span><h1 style="font-size:36px">오늘의 한 문장, 완료.</h1><p class="muted">${g.kind==='practice'?'방법 익히기라 기록과 복습 일정은 저장하지 않았어요.':'맞고 틀린 부분을 확인한 것까지 오늘의 연습입니다.'}</p><div class="stats"><div class="stat"><small>정답률 · 도움 제외</small><b>${s.acc===null?'—':s.acc+'%'}</b></div><div class="stat"><small>완료 문항</small><b>${g.rows.length}</b></div><div class="stat"><small>다시 읽은 문항</small><b>${s.assisted}</b></div></div><section class="panel"><h3>영역별 연습 기록</h3>${domainStats(g.rows)}<p class="note">영역은 연습 내용을 구분한 이름입니다. 인지기능 점수나 표준화된 검사 결과가 아닙니다. 안내를 읽고 바로 푼 문항의 정답은 장기 기억을 증명하지 않습니다.</p></section>${monitor.length?`<section class="panel"><h3>내 확신 돌아보기</h3><p>확실하다고 생각했지만 틀린 문항: <b>${confWrong}개</b></p><p class="small muted">‘모르겠다’를 알아차리는 것도 자기 점검입니다. 다시 봐야 할 부분을 찾아보세요.</p></section>`:''}<section class="panel"><h3>다음에는 이렇게</h3><p>${s.acc!==null&&s.acc>=90?'같은 단계에서, 다음 날에도 도움 없이 떠올릴 수 있는지 확인해보세요. 쉽게 느껴질 때만 다음 단계를 선택하세요.':'같은 단계에서 짧게 반복해보세요. 한 번에 기억할 양을 늘릴 필요는 없어요.'}</p><p class="small muted">${g.kind==='practice'?'연습 모드에서 완료하면 복습 일정이 생깁니다.':'직접 뜻을 맞힌 단어는 다음 날부터, 틀린 단어는 10분 뒤부터 복습 대상으로 표시됩니다. 알림을 보내지는 않습니다.'}</p></section>${!storageOK?'<p class="rulebox">현재 브라우저에서 저장이 안 됩니다. 기록 내보내기로 보관해 주세요.</p>':''}<div class="actions"><button class="btn" onclick="go('home')">연습실로</button><button class="btn alt" onclick="go('records')">기록 확인</button><button class="btn line" onclick="setup('${g.mode}')">같은 연습 다시</button></div></div>`;window.scrollTo({top:0,behavior:'instant'})}
function records(){const l=db.lang;app.innerHTML=`<span class="kicker">MY LEARNING NOTEBOOK</span><h1 style="font-size:36px">${nameLang(l)} · 내 학습 기록</h1><p class="muted">인지기능의 순위보다, 무엇을 배웠고 무엇을 다시 볼지 확인해요.</p><section class="panel"><h3>같은 조건으로 살펴보기</h3><label for="modefilter">연습</label><select id="modefilter"><option value="mix">종합 연습</option>${Object.entries(MODES).map(([k,m])=>`<option value="${k}">${m.name}</option>`).join('')}</select><label for="levelfilter">난이도</label><select id="levelfilter">${[1,2,3].map(i=>`<option>${i}</option>`).join('')}</select><div id="compare"></div><p class="note">같은 언어·모드·단계만 비교합니다. 익숙한 문항의 반복 효과가 있으며 인지기능 향상 여부는 알 수 없습니다.</p></section><section class="panel"><div class="row"><h3>완료한 세트</h3><button class="btn alt" onclick="exportData()">내보내기 ↓</button></div><div class="scroll">${db.sessions.filter(x=>x.lang===l).length?`<table><thead><tr><th>날짜</th><th>연습</th><th>단계</th><th>정답률</th></tr></thead><tbody>${db.sessions.slice().reverse().filter(s=>s.lang===l).map(s=>`<tr><td>${s.day}</td><td>${modeName(s.mode)}</td><td>${s.level}</td><td>${s.stats.acc===null?'—':s.stats.acc+'%'}<br><small>도움 ${s.stats.assisted}개 제외</small></td></tr>`).join('')}</tbody></table>`:'<p class="muted">아직 완료한 기록이 없어요.</p>'}</div></section><section class="panel"><h3>복습할 단어 ${dueCount(l)}개</h3><p class="small muted">예정 시간이 된 단어가 먼저 나옵니다. 복습 단어가 부족하면 새 단어, 그다음 예정 시간이 가까운 단어를 고릅니다.</p><div class="actions"><button class="btn" onclick="setup('recall')">단어 복습하기</button><button class="btn line" onclick="vocabulary()">단어장 보기</button></div></section><p class="note">기록은 이 브라우저에만 저장됩니다. 다른 기기로 옮겨지지 않으며 브라우저 데이터 삭제 시 사라집니다. 내보낸 JSON은 보관용이고 이 버전은 가져오기를 지원하지 않습니다.</p><details><summary>기록 관리</summary><button class="btn line" id="erase">두 언어의 모든 기록 지우기</button><div id="confirmdelete"></div></details>`;$('#modefilter').onchange=compare;$('#levelfilter').onchange=compare;compare();$('#erase').onclick=()=>{$('#confirmdelete').innerHTML='<p>영어·일본어 세트 기록과 단어 복습 일정을 모두 지웁니다. 되돌릴 수 없습니다.</p><button class="btn orange" id="deleteyes">모두 지우기</button> <button class="btn line" id="deleteno">취소</button>';$('#deleteno').onclick=()=>$('#confirmdelete').innerHTML='';$('#deleteyes').onclick=()=>{db={lang:l,sessions:[],cards:{}};save();records()}}}
function compare(){const list=db.sessions.filter(s=>s.lang===db.lang&&s.mode===$('#modefilter').value&&s.level===+$('#levelfilter').value);if(list.length<2){$('#compare').innerHTML=`<p class="muted">이 조건의 기록 ${list.length}개 · 두 세트부터 비교해요.</p>`;return}const first=list[0],last=list.at(-1);$('#compare').innerHTML=`<p>첫 기록 ${first.stats.acc===null?'—':first.stats.acc+'%'} → 최근 ${last.stats.acc===null?'—':last.stats.acc+'%'}</p><span class="small muted">${first.day} → ${last.day} · 도움 없이 답한 문항 기준</span>`}
function vocabulary(){page='vocabulary';const l=db.lang;app.innerHTML=`<button class="btn line" onclick="go('home')">← 연습실</button><h1 style="font-size:36px">${nameLang(l)} 기초 단어장</h1><p class="muted">단어를 보기만 하는 날과, 가리고 떠올리는 날을 함께 만들어보세요.</p><div class="wordlist">${WORDS[l].map((w,i)=>{const c=db.cards[wordKey(l,i)];return `<div class="worditem"><b lang="${l}">${w[0]}</b><div>${w[1]}</div><small>${!c?'아직 회상 기록 없음':c.due<=Date.now()?'지금 복습할 차례':'다음 복습: '+new Date(c.due).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small></div>`}).join('')}</div><p class="note">일본어는 기초 단어를 히라가나 중심으로 표시했습니다. 이 버전에는 음성 재생이나 발음 채점이 없습니다.</p>`}
function exportData(){const url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='one-sentence-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function guide(){app.innerHTML=`<div class="play"><span class="kicker">LEARNING TO LEARN</span><h1 style="font-size:36px">독학은, 작게 반복하는 과정.</h1><section class="panel"><h3>먼저 두뇌를 완성할 필요는 없어요.</h3><p>주의력·기억·패턴 파악은 공부에 쓰입니다. 하지만 숫자 기억 게임을 잘해야 외국어를 시작할 수 있는 것은 아닙니다. 실제 단어와 문장을 배우는 과정에서 필요한 전략을 익혀보세요.</p><ol><li><b>이해:</b> 단어 뜻과 문장 구조를 확인합니다.</li><li><b>꺼내기:</b> 가리고 뜻이나 문장을 떠올립니다.</li><li><b>확인:</b> 정답과 비교하고 이유를 읽습니다.</li><li><b>다시 보기:</b> 하루 뒤, 며칠 뒤 다시 떠올립니다.</li></ol></section><section class="panel"><h3>짧은 하루 루틴 예시</h3><p>예전에 배운 단어 2개 떠올리기 → 새 단어 2개 익히기 → 짧은 문장 하나 바꿔 말하기 → 틀린 부분 확인하기.</p><p>앞부분을 잊기 쉽다면 긴 글 대신 한 문장을 의미 조각으로 나눠보세요. 속으로 되뇌거나 메모를 쓰는 것도 유용한 방법입니다.</p><p>이 사이트 밖에서는 뜻을 확인할 사전, 쉬운 예문, 발음을 확인할 음성 자료를 함께 사용하세요. 교사나 인강 없이 공부해도 정답과 발음을 확인하는 과정은 필요합니다.</p></section><section class="panel">${Object.keys(MODES).map(k=>`<details><summary>${MODES[k].name} · ${MODES[k].title}</summary><p>${help(k)}</p></details>`).join('')}</section><section class="panel"><h3>난이도·기록 안내</h3><p><b>1단계:</b> 주의력에서 단어를 비교합니다. 다른 모드는 짧은 문장의 뜻과 틀을 익힙니다.</p><p><b>2단계:</b> 주의력에서 문장 전체를 비교합니다. 다른 모드는 1단계와 같은 기초 자료를 반복합니다.</p><p><b>3단계:</b> 작업기억에서 내용을 바꿔 기억합니다(변경 가능한 문장만). 문장 조립에는 필요 없는 단어가 추가될 수 있습니다. 회상과 자기 점검은 단계별로 내용이 달라지지 않습니다.</p><p><b>도움받음:</b> 휴식 뒤 다시 읽은 미완료 문항입니다. 정답률과 복습 일정 계산에서 제외합니다. 이미 채점한 문항은 쉬어도 보존됩니다.</p><p><b>복습 일정:</b> 회상 문항에서 직접 한국어 뜻을 맞힌 단어만 1→2→4→7→14→30일 간격을 적용합니다. 틀리면 10분 뒤로 설정하고 간격을 초기화합니다. 세트 완료 시 저장하며, 체험은 저장하지 않습니다. 단순한 복습 규칙으로 개인의 기억력을 측정하지 않습니다.</p><p><b>입력 채점:</b> 등록된 한국어 뜻과 일부 동의어를 비교합니다. 공백·일부 문장부호는 무시하지만 자유로운 문장 전체를 이해하는 AI 채점은 아닙니다.</p></section><section class="panel"><h3>기대할 수 있는 범위</h3><p>이 사이트는 영어·일본어 각각 12개 기초 단어와 6개 문장 틀을 다루는 입문 연습입니다. 외국어 전 과정을 대체하지 않으며, 전반적인 인지기능 향상 효과는 검증되지 않았습니다.</p><p>보고 다시 읽기만 하기보다 기억에서 꺼내고 간격을 두고 반복하는 학습법에는 연구 근거가 있습니다. 그 근거가 이 사이트의 효과를 직접 검증한 것은 아닙니다.</p><a href="https://www.cambridge.org/core/journals/studies-in-second-language-acquisition/article/abs/review-of-laboratory-studies-of-adult-second-language-vocabulary-training/18F0A5D1FFC829CE05931B2EEE83124A" target="_blank" rel="noopener">제2언어 어휘 학습 연구 리뷰 ↗</a></section><div class="footerlinks"><a href="./one-sentence.html" download="한문장.html">HTML 저장</a><a href="./one-sentence.zip" download>GitHub용 ZIP</a></div></div>`}
home();
</script></body></html>
