const EMPTY=()=>({version:2,done:{},cards:{},runs:[],active:null,known:{}});let db=EMPTY(),saveOK=true;
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.version===2&&d.done&&d.cards&&Array.isArray(d.runs)&&d.known)db=d}catch(e){saveOK=false}
let page='home',courseFilter='START',g=null,timers=[],epoch=0,pending='home',voices=[];
const rand=n=>Math.floor(Math.random()*n);function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s).normalize('NFKC').replace(/[\s。.!?！？,、]/g,'').toLowerCase();const day=()=>new Date().toLocaleDateString('sv-SE');
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){saveOK=false;const n=$('#savestatus');if(n)n.textContent='이 브라우저에서 저장되지 않습니다. 기록 내보내기를 이용하세요.';return false}}
function stop(){epoch++;timers.forEach(clearTimeout);timers=[];if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function later(f,ms){const t=setTimeout(f,ms);timers.push(t);return t}
function allWords(){const words=new Map();for(const l of LESSONS)for(const w of l.words)if(!words.has(w.jp))words.set(w.jp,{...w,lesson:l.id,stage:l.stage});return [...words.values()]}
function dueWords(){return allWords().filter(w=>db.cards[w.jp]&&db.cards[w.jp].due<=Date.now()).sort((a,b)=>db.cards[a.jp].due-db.cards[b.jp].due)}
function nextLesson(){return LESSONS.find(l=>!db.done[l.id])||LESSONS[0]}
function progress(){return LESSONS.filter(l=>db.done[l.id]).length}
function storeActive(){if(!g||g.review)return;db.active={id:g.l.id,step:g.step,rows:g.rows,assist:!!g.assist};persist()}
function nav(p){if(g){pending=p;storeActive();pause();$('#leave').showModal();return}open(p)}
function open(p){stop();g=null;page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='home')home();else if(p==='path')path();else if(p==='review')review();else if(p==='records')records();else guide();window.scrollTo({top:0,behavior:'instant'})}
for(const b of document.querySelectorAll('[data-page]'))b.onclick=()=>nav(b.dataset.page);$('#stay').onclick=()=>{$('#leave').close();resume()};$('#away').onclick=()=>{$('#leave').close();open(pending)};$('#leave').addEventListener('cancel',()=>later(resume,0));
function home(){const l=db.active?LESSONS.find(l=>l.id===db.active.id)||nextLesson():nextLesson(),due=dueWords().length;app.innerHTML=`<section class="hero"><div><div class="kicker">ONE SENTENCE · YOUR JAPANESE PATH</div><h1>N2를 향해,<br>오늘도 한 문장.</h1><p class="muted">페이지를 끝내기보다, 한 가지를 이해하기.<br>오늘 배울 것부터 복습까지 차근차근 안내합니다.</p><div class="route">${LEVELS.map((v,i)=>`<span class="${v.id===l.stage?'next':''}">${v.id==='START'?'입문':v.id}</span>${i<4?'→':''}`).join('')}</div></div><div class="book" aria-hidden="true"><div class="book-sheet"><small>SMALL LESSONS, STEADY STEPS</small><b>いすです。</b><span class="muted">의자입니다.</span><div class="book-line"></div><small>뜻 연결 → 한 문장 → 5초 복습</small></div></div></section><section class="feature"><div><span class="kicker" style="color:#ead0b4">${db.active?'CONTINUE YOUR LESSON':'YOUR NEXT SMALL LESSON'}</span><h2>${esc(l.title)}</h2><p>${l.stage==='START'?'입문':l.stage} · 한 번에 한 화면 · 중간 위치 자동 저장</p><span class="small">${db.active?'하던 화면부터 이어갈 수 있어요.':'처음 배우는 내용은 충분히 보고 시작해요.'}</span></div><button class="btn" onclick="startLesson('${l.id}',${!!db.active})">${db.active?'이어서 배우기':'수업 시작하기'} →</button></section><div class="sectionhead"><h2>나의 학습 길</h2><span class="tag">제공 수업 ${progress()} / ${LESSONS.length}개 학습</span></div><div class="grid"><article class="card"><span class="kicker">REVIEW</span><h3>다시 떠올릴 단어 ${due}개</h3><p>뜻을 먼저 보여주지 않고 기억을 확인합니다. 틀린 단어는 더 일찍 다시 봐요.</p><button class="btn alt" onclick="nav('review')">복습하러 가기 →</button></article><article class="card"><span class="kicker">COURSE MAP</span><h3>입문부터 N2 주제까지</h3><p>현재 32개 미니 수업을 제공합니다. 어느 수업이든 직접 골라볼 수 있어요.</p><button class="btn alt" onclick="nav('path')">전체 과정 보기 →</button></article><article class="card"><span class="kicker">STUDY GUIDE</span><h3>내 속도로 배우기</h3><p>새 단어가 어렵다면 잠깐 멈춰 뜻을 연결해요. 읽는 법과 설명도 바로 확인합니다.</p><button class="btn line" onclick="nav('guide')">공부 방법 · 음성 안내 →</button></article></div><p class="notice">현재 범위: 입문 8개＋N5·N4·N3·N2 주제별 6개씩. 각 급의 전체 어휘·문법·독해·청취 범위를 갖춘 완성 과정은 아닙니다. N2 수업은 해당 주제의 첫 연습 묶음입니다.</p><p class="note" id="savestatus">${saveOK?'수업 위치와 기록은 현재 브라우저에 저장됩니다. 다른 기기·다운로드 파일과 자동 동기화되지 않습니다.':'현재 브라우저에서 기록이 저장되지 않습니다.'}</p><p class="note">한 문장 · 단독 HTML 버전</p>`}
function path(){const level=LEVELS.find(x=>x.id===courseFilter);app.innerHTML=`<div class="kicker">A PATH YOU CAN FOLLOW</div><h1 style="font-size:36px">한곳에서 이어가는 일본어</h1><p class="muted">새 내용이 낯설다면 입문부터. 아는 내용은 건너뛰고 골라볼 수 있어요.</p><div class="filters" aria-label="과정 단계">${LEVELS.map(l=>`<button onclick="setFilter('${l.id}')" aria-pressed="${courseFilter===l.id}" class="${courseFilter===l.id?'selected':''}">${l.id==='START'?'입문':l.id}</button>`).join('')}</div><section class="panel"><div class="row"><div><span class="kicker">${level.name}</span><h2>${level.desc}</h2></div></div><p class="small muted">${level.focus}</p>${LESSONS.filter(l=>l.stage===courseFilter).map((l,i)=>`<div class="lessonrow"><span class="lessonnum">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(l.title)}</h3><p>${db.done[l.id]?'학습함 · 다시 연습할 수 있어요':db.active?.id===l.id?'수업 중 · 이어서 가능':'학습 가능'} · 단어 2개 / 핵심 틀 1개</p></div><button class="btn ${db.done[l.id]?'line':'alt'}" onclick="startLesson('${l.id}',${db.active?.id===l.id})">${db.active?.id===l.id?'이어서':db.done[l.id]?'다시 보기':'배우기'} →</button></div>`).join('')}</section><p class="notice">단계는 학습을 위한 분류입니다. JLPT 공식 문법 출제 목록이 아니며, 이 묶음의 완료가 해당 급의 합격 수준을 의미하지 않습니다.</p>`}
function setFilter(f){courseFilter=f;path()}
function startLesson(id,resuming=false){stop();const l=LESSONS.find(x=>x.id===id);if(!l)return;const old=resuming&&db.active?.id===id?db.active:null;g={l,step:old?Math.max(0,Math.min(8,old.step)):0,rows:old?.rows||[],assist:old?.assist||false,paused:false,locked:true,review:false};page='lesson';storeActive();shell();renderStep();window.scrollTo({top:0,behavior:'instant'})}
function shell(){app.innerHTML=`<section class="play"><div class="row"><b>${g.review?'단어 복습':(g.l.stage==='START'?'입문':g.l.stage)+' · '+g.l.title}</b><button class="btn line" id="pause">잠깐 쉬기</button></div><div class="progress"><div id="bar"></div></div><div class="row small muted"><span id="count"></span><span id="savestatus">한 화면씩 · 서두르지 않기</span></div><div class="steps" id="steps"></div><section class="panel"><div class="arena" id="arena"></div><div class="options" id="options"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="actions" id="nextbox" style="justify-content:center"></div></section><p class="note">처음에는 뜻을 충분히 연결하세요. 5초 타이머는 복습 화면에서 ‘보기 시작’을 눌렀을 때만 작동합니다. 화면을 벗어나면 자동으로 쉽니다.</p></section>`;$('#pause').onclick=pause}
function clearUI(){stop();g.locked=true;$('#arena').innerHTML='';$('#options').innerHTML='';$('#options').className='options';$('#feedback').className='feedback';$('#feedback').textContent='';$('#nextbox').innerHTML=''}
function primaryNext(text='다음으로 →'){const b=document.createElement('button');b.className='btn';b.textContent=text;b.onclick=advance;$('#nextbox').replaceChildren(b)}
function advance(){if(!g||g.paused)return;if(g.review){g.reviewIndex++;if(g.reviewIndex>=g.words.length){finishReview();return}g.assist=false;renderReviewQuestion();return}g.step++;g.assist=false;if(g.step>=STAGES.length){finishLesson();return}storeActive();renderStep();window.scrollTo({top:0,behavior:'instant'})}
function reading(jp,kana){return `<div class="foreign" lang="ja">${esc(jp)}</div><details style="width:100%;border:0;padding:0"><summary class="small muted">読み方 · 읽는 법 보기</summary><p class="reading" lang="ja">${esc(kana)}</p></details>`}
function soundControls(text){return `<div class="inlinecontrols"><button class="btn alt" type="button" id="say">소리 듣기 · 기기 음성</button></div><span id="soundstatus" class="small muted" role="status"></span>`}
function bindSay(text){if($('#say'))$('#say').onclick=()=>speak(text,()=>{},false)}
function renderStep(){if(!g||g.paused)return;clearUI();$('#bar').style.width=g.step/STAGES.length*100+'%';$('#count').textContent=`${g.step+1} / ${STAGES.length} 화면`;$('#steps').innerHTML=STAGES.map((s,i)=>`<span class="${i===g.step?'current':''}">${s}</span>`).join('');const already=g.rows.find(r=>r.step===g.step);if(already){$('#arena').innerHTML='<h2>이 문항은 확인했어요.</h2><p class="muted">저장한 결과를 유지합니다.</p>';showSaved(already);return}const l=g.l;
 if(g.step<2){const w=l.words[g.step],known=db.known[w.jp];$('#arena').innerHTML=`<span class="kicker">${known?'알고 있다고 표시한 단어':'새 단어 하나'}</span>${reading(w.jp,w.kana)}<div class="translation">${esc(w.ko)}</div><p class="small muted">뜻을 연결하는 시간입니다. 타이머 없이 충분히 봐도 괜찮아요.</p>${soundControls(w.kana)}`;$('#options').innerHTML=`<button id="wordready">뜻을 연결했어요 →</button><button id="wordknown">${known?'이미 아는 단어 · 다음으로':'이미 아는 단어예요 →'}</button>`;$('#wordready').onclick=advance;$('#wordknown').onclick=()=>{db.known[w.jp]=true;persist();advance()};bindSay(w.kana);return}
 if(g.step===2){$('#arena').innerHTML=`<span class="kicker">오늘의 문장 틀</span>${reading(l.jp,l.kana)}<div class="translation">${esc(l.ko)}</div><div class="gloss">${l.parts.map(p=>`<span lang="ja">${esc(p.jp)}<small>${esc(p.ko)}</small></span>`).join('')}</div><div class="rulebox">${esc(l.rule)}</div><p class="small">단어를 바꾸면: <span lang="ja">${esc(l.alt.jp)}</span><br><span class="muted">${esc(l.alt.ko)}</span></p>${soundControls(l.kana)}`;bindSay(l.kana);primaryNext('뜻을 이해했어요 →');return}
 if(g.step===3){const others=LESSONS.filter(x=>x.stage===l.stage&&x.id!==l.id).map(x=>x.ko);g.q={type:'meaning',options:shuffle([l.ko,...shuffle(others).slice(0,2)]),correct:l.ko,explain:l.rule};$('#arena').innerHTML='<h3>이 문장의 뜻은 무엇인가요?</h3>'+reading(l.jp,l.kana);renderChoices();return}
 if(g.step===4){g.tokens=shuffle(l.buildParts.map((p,i)=>({text:p.jp,ko:p.ko,id:i})));g.selected=[];$('#arena').innerHTML=`<h3>배운 틀로 단어를 바꿔 써보세요.</h3><p class="translation">${esc(l.alt.ko)}</p><div id="assembled" class="answerline" aria-label="만든 문장"></div><div id="tokens" class="tokens"></div><p class="small muted">조각을 순서대로 누르세요. 위 조각을 누르면 취소됩니다.</p>`;$('#options').innerHTML='<button id="checkbuild" class="full">문장 확인하기</button>';g.locked=false;renderTokens();$('#checkbuild').onclick=()=>{if(!g.selected.length){$('#feedback').textContent='단어 조각을 먼저 눌러주세요.';return}const answer=g.selected.map(i=>g.tokens[i].text).join('');grade({type:'build',ok:clean(answer)===clean(l.buildParts.map(p=>p.jp).join('')),answer,correct:l.alt.jp,explain:l.rule})};return}
 if(g.step===5||g.step===6){memoryCard(l.words[g.step-5]);return}
 if(g.step===7){g.q={type:'read',options:l.options,correct:l.options[l.correct],explain:l.why};$('#arena').innerHTML=`<h3>짧은 글에서 요점을 찾아요.</h3><div class="shortread" lang="ja">${esc(l.read)}</div><details id="readhelp" style="width:100%;text-align:left"><summary class="small">뜻·추가 어휘 확인하기 (도움 표시)</summary><p class="small" style="white-space:pre-wrap">${esc(l.readko)}</p></details><p class="translation">${esc(l.question)}</p>`;$('#readhelp').ontoggle=e=>{if(e.target.open&&!g.locked){g.assist=true;storeActive()}};renderChoices();return}
 listening();
}
function renderTokens(){if(!g)return;$('#assembled').innerHTML=g.selected.length?g.selected.map((idx,i)=>`<button data-remove="${i}">${esc(g.tokens[idx].text)}</button>`).join(''):'<span class="small muted">여기에 문장을 만들어요</span>';$('#tokens').innerHTML=g.tokens.map((t,i)=>`<button data-token="${i}" ${g.selected.includes(i)?'disabled':''}>${esc(t.text)}<br><small class="muted">${esc(t.ko)}</small></button>`).join('');for(const b of document.querySelectorAll('[data-token]'))b.onclick=()=>{if(g.locked)return;g.selected.push(+b.dataset.token);renderTokens()};for(const b of document.querySelectorAll('[data-remove]'))b.onclick=()=>{if(g.locked)return;g.selected.splice(+b.dataset.remove,1);renderTokens()}}
function renderChoices(){g.locked=false;$('#options').innerHTML=g.q.options.map((t,i)=>`<button data-answer="${i}">${esc(t)}</button>`).join('');for(const b of document.querySelectorAll('[data-answer]'))b.onclick=()=>{if(g.locked)return;const q=g.q,a=q.options[+b.dataset.answer];grade({type:q.type,ok:a===q.correct,answer:a,correct:q.correct,explain:q.explain})}}
function memoryCard(w){g.memoryWord=w;g.memoryPhase='ready';$('#arena').innerHTML=`<h3>5초 동안 보고, 가린 뒤 떠올려요.</h3><div id="memoryface" class="memoryface"><p class="muted">준비되면 ‘보기 시작’을 누르세요.</p></div><span id="memorytime" class="small timertext" role="status">준비 중</span><div class="progress" style="width:100%"><div id="memorybar" style="width:0%"></div></div>`;$('#options').innerHTML='<button id="beginmemory" class="full">보기 시작 · 5초</button>';$('#beginmemory').onclick=()=>{if(g.memoryPhase!=='ready')return;g.memoryPhase='showing';$('#beginmemory').disabled=true;$('#memoryface').innerHTML=`<div class="foreign" lang="ja">${esc(w.jp)}</div><div class="reading" lang="ja">${esc(w.kana)}</div><div class="translation">${esc(w.ko)}</div>`;const target=epoch;requestAnimationFrame(()=>{if(!g||g.paused||epoch!==target)return;const deadline=performance.now()+5000;later(()=>{if(g&&!g.paused&&epoch===target)hideMemory(w)},5000);function tick(){if(!g||g.paused||epoch!==target)return;const left=deadline-performance.now();if(left<=0){hideMemory(w);return}$('#memorytime').textContent=Math.ceil(left/1000)+'초 뒤 자동 가림';$('#memorybar').style.width=left/5000*100+'%';later(tick,80)}tick()})}}
function hideMemory(w){if(!g||g.paused||g.memoryPhase!=='showing')return;g.memoryPhase='answer';$('#memoryface').innerHTML='<p>단어와 뜻을 가렸어요.</p>';$('#memorytime').textContent='5초 완료 · 자동 가림';$('#memorybar').style.width='0%';renderInput(w,false)}
function renderInput(w,reviewing){g.locked=false;$('#options').innerHTML='';const area=document.createElement('form');area.className='recallform';area.id='recallform';area.innerHTML=`<label for="answerinput">${reviewing?'이 단어의':'방금 본 단어의'} 한국어 뜻은?</label><input id="answerinput" autocomplete="off" maxlength="50" placeholder="뜻을 입력하세요"><div class="actions"><button class="btn" type="submit">답 확인</button><button class="btn line" id="forgot" type="button">기억 안 나요</button></div>`;$('#options').replaceChildren(area);area.classList.add('full');area.onsubmit=e=>{e.preventDefault();const val=$('#answerinput').value;if(!val.trim()){$('#feedback').textContent='뜻을 적거나 ‘기억 안 나요’를 눌러주세요.';return}const ok=[w.ko,...w.aliases].some(a=>clean(a)===clean(val));grade({type:'word',ok,answer:val,correct:w.ko,explain:w.jp+' ＝ '+w.ko,word:w.jp})};$('#forgot').onclick=()=>grade({type:'word',ok:false,answer:'기억 안 나요',correct:w.ko,explain:w.jp+' ＝ '+w.ko,word:w.jp})}
function grade(result){if(!g||g.paused||g.locked||g.rows.some(r=>r.step===(g.review?g.reviewIndex:g.step)))return;g.locked=true;const row={...result,step:g.review?g.reviewIndex:g.step,assisted:!!g.assist,at:Date.now()};g.rows.push(row);if(!g.review)storeActive();for(const b of document.querySelectorAll('[data-answer]')){b.disabled=true;if(g.q&&g.q.options[+b.dataset.answer]===result.correct)b.classList.add('correct');else if(g.q&&g.q.options[+b.dataset.answer]===result.answer)b.classList.add('wrong')}for(const b of document.querySelectorAll('#answerinput,#recallform button,[data-token],[data-remove],#checkbuild'))b.disabled=true;showSaved(row)}
function showSaved(row){$('#feedback').className='feedback '+(row.skipped?'':row.ok?'good':'bad');$('#feedback').textContent=row.skipped?row.explain:(row.ok?'맞았어요. ':'정답을 확인해요. ')+row.correct+'\n'+row.explain+(row.assisted?'\n도움받음: 정답률 비교와 복습 간격 계산에서 제외합니다.':'');primaryNext(g.review&&g.reviewIndex+1===g.words.length?'복습 결과 보기 →':!g.review&&g.step===8?'수업 마치기 →':'다음으로 →')}
function updateVoices(){voices='speechSynthesis'in window?window.speechSynthesis.getVoices().filter(v=>/^ja(?:-|_)/i.test(v.lang)):[]}
if('speechSynthesis'in window){updateVoices();window.speechSynthesis.addEventListener('voiceschanged',updateVoices)}
function speak(text,onend,listeningMode){updateVoices();const status=$('#soundstatus');if(!('speechSynthesis'in window)||!window.SpeechSynthesisUtterance||!voices.length){if(status)status.textContent='현재 기기에서 일본어 음성을 찾지 못했어요. 대본으로 확인하거나 공식 음성을 이용하세요.';return false}window.speechSynthesis.cancel();const round=epoch,utter=new SpeechSynthesisUtterance(text);utter.lang='ja-JP';utter.voice=voices[0];utter.rate=.85;let started=false;utter.onstart=()=>{started=true;if(status&&epoch===round)status.textContent='재생 중 · 기기 합성 음성'};utter.onend=()=>{if(epoch!==round||!g)return;if(status)status.textContent='재생 완료 · 실제 화자 녹음과 차이가 있을 수 있어요.';onend()};utter.onerror=()=>{if(epoch!==round)return;if(status)status.textContent='소리를 재생하지 못했어요. 대본으로 확인할 수 있습니다.'};g.utter=utter;window.speechSynthesis.speak(utter);later(()=>{if(epoch===round&&!started&&status)status.textContent='아직 소리가 안 들리면 대본으로 확인하세요. 기기 음성 지원에 따라 달라집니다.'},5000);return true}
function listening(){const l=g.l;g.played=false;$('#arena').innerHTML=`<h3>소리를 듣고 뜻을 골라요.</h3><p class="small muted">기기 합성 음성으로 오늘 문장을 확인합니다.<br>실제 화자 녹음 청취 평가가 아닙니다.</p>${soundControls(l.kana)}<button class="btn line" id="transcript">소리가 안 나요 · 대본으로 확인</button><div id="transcriptarea"></div>`;$('#options').innerHTML='';$('#say').onclick=()=>speak(l.kana,()=>{if(!g||g.step!==8||g.rows.some(r=>r.step===8))return;g.played=true;const alternatives=shuffle(LESSONS.filter(x=>x.stage===l.stage&&x.id!==l.id).map(x=>x.ko)).slice(0,2);g.q={type:'listen',correct:l.ko,options:shuffle([l.ko,...alternatives]),explain:'들었던 문장: '+l.jp};renderChoices()},true);$('#transcript').onclick=()=>{if(g.rows.some(r=>r.step===8))return;g.assist=true;g.locked=false;$('#transcriptarea').innerHTML=`${reading(l.jp,l.kana)}<p>${esc(l.ko)}</p>`;g.locked=true;const row={type:'listen',ok:false,skipped:true,assisted:true,step:8,correct:'',answer:'대본으로 확인',explain:'대본으로 확인했습니다. 청취 문항은 미실시로 기록하며 정답률에서 제외합니다.',at:Date.now()};g.rows.push(row);storeActive();showSaved(row)}}
function pause(){if(!g||g.paused)return;stop();g.paused=true;g.locked=true;storeActive();$('#pause').disabled=true;$('#arena').innerHTML='<h2>잠깐 쉬어가요.</h2><p class="muted">지금까지 한 내용을 저장했어요.</p>';$('#options').innerHTML='<button id="resume">이어서 하기</button><button id="quit">오늘은 여기까지</button>';$('#feedback').textContent='미완료 문항은 다시 봅니다. 복습·평가 중 다시 본 문항에는 도움 표시를 붙여요.';$('#nextbox').innerHTML='';$('#resume').onclick=resume;$('#quit').onclick=()=>{pending='home';$('#leave').showModal()}}
function resume(){if(!g||!g.paused)return;g.paused=false;$('#pause').disabled=false;if(g.review){g.assist=true;renderReviewQuestion();return}if(g.step>=3&&!g.rows.some(r=>r.step===g.step))g.assist=true;storeActive();renderStep()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&g)pause()});
function summarize(rows){const r=rows.filter(x=>!x.assisted&&!x.skipped),ok=r.filter(x=>x.ok);return {n:r.length,ok:ok.length,acc:r.length?Math.round(ok.length/r.length*100):null,helped:rows.filter(x=>x.assisted&&!x.skipped).length,listened:rows.some(x=>x.type==='listen'&&!x.skipped),skipped:rows.filter(x=>x.skipped).length}}
function schedule(word,ok,now=Date.now()){const old=db.cards[word]||{streak:0,reviews:0},streak=ok?old.streak+1:0,days=[1,2,4,7,14,30];db.cards[word]={streak,reviews:old.reviews+1,due:now+(ok?days[Math.min(streak-1,5)]*86400000:600000),last:now,lastOK:ok}}
function commitWords(rows){const byWord=new Map();for(const r of rows)if(r.type==='word'&&!r.assisted)byWord.set(r.word,r);for(const [word,r]of byWord)schedule(word,r.ok)}
function finishLesson(){if(!g)return;stop();const l=g.l,rows=g.rows,summary=summarize(rows),run={id:l.id,stage:l.stage,day:day(),at:new Date().toISOString(),rows,summary};commitWords(rows);db.done[l.id]={at:run.at,count:(db.done[l.id]?.count||0)+1,summary};db.runs.push(run);db.active=null;persist();g=null;page='result';const i=LESSONS.findIndex(x=>x.id===l.id),next=LESSONS[i+1];app.innerHTML=`<section class="play"><div class="kicker">ONE LESSON, ONE SMALL STEP</div><h1 style="font-size:36px">오늘의 수업을 마쳤어요.</h1><p class="muted">${esc(l.title)}</p><div class="stats"><div class="stat"><small>정답률 · 도움 제외</small><b>${summary.acc===null?'—':summary.acc+'%'}</b></div><div class="stat"><small>확인 문항</small><b>${rows.length}</b></div><div class="stat"><small>학습한 미니 수업</small><b>${progress()}/${LESSONS.length}</b></div></div><section class="panel"><h3>오늘 익힌 문장</h3>${reading(l.jp,l.kana)}<p>${esc(l.ko)}</p><p class="small muted">${esc(l.rule)}</p></section><section class="panel"><h3>다음 복습</h3><p>뜻을 직접 맞힌 단어는 내일부터, 틀린 단어는 10분 뒤부터 복습 목록에 표시합니다.</p><p class="small muted">도움받은 문항 ${summary.helped}개 · 청취 ${summary.listened?'기기 음성으로 확인':'미실시 / 대본 확인'}. 학습 완료는 이 수업을 끝냈다는 뜻이며 숙달이나 해당 급 합격을 의미하지 않습니다.</p></section><div class="actions">${next?`<button class="btn" onclick="startLesson('${next.id}')">다음 수업 →</button>`:'<button class="btn" onclick="nav(\'path\')">제공 과정 다시 살펴보기</button>'}<button class="btn alt" onclick="nav('review')">단어 복습</button><button class="btn line" onclick="nav('home')">오늘 화면</button></div>${!saveOK?'<p class="notice">현재 브라우저에서 저장되지 않았습니다. 기록 내보내기로 보관해 주세요.</p>':''}</section>`;window.scrollTo({top:0,behavior:'instant'})}
function review(){const due=dueWords(),learned=allWords().filter(w=>db.cards[w.jp]);app.innerHTML=`<div class="kicker">REMEMBER, THEN CHECK</div><h1 style="font-size:36px">다시 떠올릴 시간</h1><p class="muted">복습은 뜻을 미리 보여주지 않고 시작합니다.</p><section class="feature"><div><h2>지금 복습할 단어 ${due.length}개</h2><p>한 번에 최대 6개씩 확인합니다. 내일 기억나는지도 살펴봐요.</p></div>${due.length?'<button class="btn" onclick="startReview()">복습 시작 →</button>':'<button class="btn" onclick="nav(\'home\')">다음 수업 보기 →</button>'}</section><section class="panel"><h3>내 단어장 · 회상 기록 ${learned.length}개</h3>${learned.length?`<div class="wordgrid">${learned.map(w=>{const c=db.cards[w.jp];return `<div class="worditem"><b lang="ja">${esc(w.jp)}</b><small lang="ja">${esc(w.kana)}</small><div>${esc(w.ko)}</div><small>${c.due<=Date.now()?'지금 복습할 차례':'다음: '+new Date(c.due).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small></div>`}).join('')}</div>`:'<p class="muted">수업의 5초 복습을 마치면 단어와 일정이 생깁니다.</p>'}</section><p class="note">단어장을 본 직후 답하면 장기 기억을 확인하기 어렵습니다. 예정 시간이 된 뒤 답을 보지 않고 복습해보세요. 이 서비스가 알림을 보내지는 않습니다.</p>`}
function startReview(){const words=dueWords().slice(0,6);if(!words.length){review();return}stop();g={review:true,words,reviewIndex:0,rows:[],paused:false,assist:false,locked:true};page='lesson';shell();renderReviewQuestion()}
function renderReviewQuestion(){if(!g||g.paused)return;clearUI();$('#bar').style.width=g.reviewIndex/g.words.length*100+'%';$('#count').textContent=`${g.reviewIndex+1} / ${g.words.length} 단어`;$('#steps').innerHTML='';const w=g.words[g.reviewIndex];$('#arena').innerHTML=`<span class="kicker">답을 보지 않고 떠올리기</span>${reading(w.jp,w.kana)}`;renderInput(w,true)}
function finishReview(){const rows=g.rows,summary=summarize(rows);stop();commitWords(rows);db.runs.push({id:'review',stage:'REVIEW',day:day(),at:new Date().toISOString(),rows,summary});persist();g=null;page='result';app.innerHTML=`<section class="play"><span class="kicker">REVIEW COMPLETE</span><h1 style="font-size:36px">복습을 마쳤어요.</h1><div class="stats"><div class="stat"><small>정답률 · 도움 제외</small><b>${summary.acc===null?'—':summary.acc+'%'}</b></div><div class="stat"><small>맞힌 단어</small><b>${summary.ok}/${summary.n}</b></div><div class="stat"><small>도움받음</small><b>${summary.helped}</b></div></div><p class="muted">맞힌 단어의 다음 간격을 늘렸어요. 틀린 단어는 10분 뒤부터 다시 볼 수 있습니다.</p><div class="actions"><button class="btn" onclick="nav('home')">오늘 화면</button><button class="btn alt" onclick="nav('review')">복습 목록</button></div></section>`}
function records(){app.innerHTML=`<div class="kicker">MY LEARNING NOTEBOOK</div><h1 style="font-size:36px">내가 쌓은 한 문장</h1><p class="muted">현재 제공하는 ${LESSONS.length}개 미니 수업 중 ${progress()}개를 학습했어요.</p><section class="panel"><h3>단계별 학습</h3>${LEVELS.map(v=>{const n=LESSONS.filter(l=>l.stage===v.id),d=n.filter(l=>db.done[l.id]);return `<div class="row"><b>${v.name}</b><span class="small">${d.length}/${n.length}개 제공 수업</span></div><div class="progress" style="margin:9px 0 18px"><div style="width:${d.length/n.length*100}%"></div></div>`}).join('')}<p class="note">이 비율은 제공 수업의 학습 기록이며 JLPT 범위 전체의 진행률이 아닙니다.</p></section><section class="panel"><div class="row"><h3>수업·복습 기록</h3><button class="btn alt" onclick="exportData()">내보내기 ↓</button></div><div class="scroll">${db.runs.length?`<table><thead><tr><th>날짜</th><th>수업</th><th>정답률</th><th>청취</th></tr></thead><tbody>${db.runs.slice().reverse().map(r=>`<tr><td>${r.day}</td><td>${esc(r.id==='review'?'단어 복습':LESSONS.find(l=>l.id===r.id)?.title||r.id)}</td><td>${r.summary.acc===null?'—':r.summary.acc+'%'}<br><small>도움 ${r.summary.helped}개 제외</small></td><td>${r.id==='review'?'—':r.summary.listened?'기기 음성':'미실시'}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">아직 완료한 수업이 없습니다.</p>'}</div></section><p class="note">기록과 중간 위치는 현재 브라우저에 저장됩니다. 브라우저 데이터 삭제 시 사라집니다. 내보내기 파일로 보관할 수 있으며, 이 버전에는 가져오기가 없습니다. 이전 연습실의 기록은 별도로 유지됩니다.</p><p class="note">한 문장 · 단독 HTML 버전</p><details><summary>새 과정 기록 관리</summary><button class="btn line" id="erase">새 과정의 기록·단어 일정 지우기</button><div id="confirmdelete"></div></details>`;$('#erase').onclick=()=>{$('#confirmdelete').innerHTML='<p>새 과정의 수업·중간 위치·단어 복습 기록을 모두 지웁니다. 되돌릴 수 없습니다. 이전 연습실 기록은 별도입니다.</p><button class="btn orange" id="deleteyes">모두 지우기</button> <button class="btn line" id="deleteno">취소</button>';$('#deleteno').onclick=()=>$('#confirmdelete').innerHTML='';$('#deleteyes').onclick=()=>{db=EMPTY();persist();records()}}}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='one-sentence-course-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function guide(){app.innerHTML=`<section class="play"><span class="kicker">SMALL LESSONS, CLEAR NEXT STEPS</span><h1 style="font-size:36px">이 사이트로 공부하는 방법</h1><section class="panel"><h3>한 번에 한 화면이면 충분해요.</h3><ol><li>‘수업 시작하기’를 눌러 새 단어 두 개의 뜻을 연결하세요.</li><li>문장과 짧은 설명을 읽고 뜻을 확인합니다.</li><li>조각을 눌러 문장을 만들고, 복습에서 5초 자동 가림을 사용합니다.</li><li>짧은 글과 기기 음성으로 오늘 표현을 확인합니다.</li><li>수업을 마치면 다음 수업과 단어 복습이 안내됩니다.</li></ol><p>글자나 뜻이 모르면 충분히 확인하고 넘어가세요. 처음부터 제한시간 안에 외워야 하는 과정은 아닙니다. 익숙한 단어에는 ‘이미 아는 단어예요’를 눌러 지나갈 수 있어요.</p></section><section class="panel"><h3>현재 수업의 범위</h3><p>입문 8개, N5·N4·N3·N2 주제별 6개씩 총 32개의 자체 제작 미니 수업을 제공합니다. 단계는 학습 편의를 위한 분류이며 공식 JLPT 출제 목록이 아닙니다.</p><p>각 급의 전체 어휘·문법·한자 범위와 긴 독해·자연스러운 대화 청취는 아직 모두 갖추지 않았습니다. 모든 수업을 마쳐도 N2 합격 수준을 의미하지 않습니다.</p><p>수업은 학습 완료와 숙달을 구분합니다. 복습 간격은 정답일 때 1→2→4→7→14→30일, 오답이면 10분입니다. 도움받은 답은 간격 계산에서 제외합니다. 짧은 즉시 회상은 장기 기억을 증명하지 않습니다.</p><p>입력 채점은 제시한 한국어 뜻과 일부 동의어만 비교합니다. 자유로운 문장 전체를 이해하는 AI 채점이 아닙니다. 문장 조립은 이 수업에서 제시한 틀을 연습합니다.</p></section><section class="panel"><h3>음성이 안 들릴 때</h3><p>현재 수업의 ‘소리 듣기’는 기기에 설치된 일본어 합성 음성을 사용합니다. 기기에 일본어 음성이 없거나 브라우저가 지원하지 않으면 재생되지 않습니다. 대본을 확인하면 청취 미실시로 기록하고 수업은 계속할 수 있습니다.</p><p>실제 화자의 음성, 다양한 대화와 긴 듣기 자료는 아래 공식 자료를 함께 활용하세요. 공식 자료는 새 창에서 열립니다.</p><div class="actions"><a class="btn alt" href="https://www.irodori.jpf.go.jp/starter/audio/lesson01.html" target="_blank" rel="noopener">이로도리 입문 실제 음성 ↗</a><a class="btn line" href="https://www.jlpt.jp/e/samples/sampleindex.html" target="_blank" rel="noopener">JLPT 공식 문제·음성 ↗</a></div><p class="note">이로도리의 한국어판 주소는 현재 코드가 표시되는 문제가 있어 일본 공식 음성 페이지로 연결합니다. 이 수업 자체는 한국어로 설명합니다.</p></section><section class="panel"><h3>N2라는 목표</h3><p>N2는 일상뿐 아니라 다양한 장면의 글과 자연스러운 속도에 가까운 대화·뉴스를 어느 정도 이해하는 능력을 요구합니다. 짧은 문장만 반복하는 것으로 충분하지 않으며, 이후에는 읽는 길이와 듣는 자료의 다양성을 넓혀야 합니다.</p><a href="https://www.jlpt.jp/e/about/levelsummary.html" target="_blank" rel="noopener">JLPT 공식 단계 설명 ↗</a><p class="note">이 사이트는 언어 학습용이며 인지기능 검사나 치료 프로그램이 아닙니다.</p></section><p class="note">한 문장 · 단독 HTML 버전</p></section>`}
open('home');
</script></body></html>
